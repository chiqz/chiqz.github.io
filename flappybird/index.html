<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird - Absolute Pixel Art & Parallax</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #111; 
            display: flex; justify-content: center; align-items: center; 
            height: 100dvh; 
            width: 100vw;
            overflow: hidden;
            touch-action: none; 
        }
        #game-container {
            position: relative;
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
        }
        canvas {
            display: block;
            height: 100%;
            max-width: 100%;
            aspect-ratio: 288 / 512;
            object-fit: contain;
            background-color: #70c5ce; 
            /* Ép tắt khử răng cưa trên toàn bộ trình duyệt */
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .home-button {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 9999;
        }
        .home-button img {
            width: 120px;
            height: auto;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .home-button img:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    
    <a href="/" class="home-button">
        <img src="https://icons.iconarchive.com/icons/double-j-design/origami-colored-pencil/256/blue-home-icon.png" alt="Home">
    </a>
    

    <div id="game-container">
        <canvas id="gameCanvas" width="288" height="512"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // --- TẢI TÀI NGUYÊN ---
        const sprites = {
            bgDay: new Image(), bgNight: new Image(), ground: new Image(), bird: new Image(),
            pipeBottom: new Image(), getReady: new Image()
        };
        sprites.bgDay.src = "https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/sprites/background-day.png";
        sprites.bgNight.src = "https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/sprites/background-night.png";
        sprites.ground.src = "https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/sprites/base.png";
        sprites.bird.src = "https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/sprites/yellowbird-midflap.png";
        sprites.pipeBottom.src = "https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/sprites/pipe-green.png";
        sprites.getReady.src = "https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/sprites/message.png";

        const numSprites = [];
        for (let i = 0; i <= 9; i++) {
            let img = new Image();
            img.src = `https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/sprites/${i}.png`;
            numSprites.push(img);
        }

        const audio = {
            wing: new Audio("https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/audio/wing.wav"),
            hit: new Audio("https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/audio/hit.wav"),
            point: new Audio("https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/audio/point.wav")
        };

        // --- BIẾN TOÀN CỤC ---
        let frames = 0;
        let gameState = "PREGAME"; // PREGAME, PLAYING, PAUSED, GAMEOVER
        let score = 0;
        let bestScore = localStorage.getItem("flappySpriteBest") || 0;
        let isNewBest = false;
        let dayNightAlpha = 0; // Biến chuyển ngày đêm (0 = ngày, 1 = đêm)
        let bgX = 0; // Toạ độ X của phông nền phía sau (để cuộn cảnh Parallax)
        let gameOverTimer = 0;
        let uiY = 512; 

        const physics = { gravity: 0.25, jump: -4.6, speed: 2 };

        const flash = {
            alpha: 0,
            trigger: function() { this.alpha = 1; },
            draw: function() {
                if (this.alpha > 0) {
                    ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    this.alpha -= 0.05; 
                }
            }
        };

        const bird = {
            x: 50, y: 200, w: 34, h: 24, velocity: 0,
            draw: function() {
                let rotation = (gameState === "GAMEOVER") 
                    ? Math.PI / 2 : Math.min(Math.PI / 2, Math.max(-Math.PI / 4, (this.velocity * 0.1)));
                ctx.save();
                ctx.translate(Math.round(this.x + this.w / 2), Math.round(this.y + this.h / 2));
                ctx.rotate(rotation);
                ctx.drawImage(sprites.bird, -this.w / 2, -this.h / 2);
                ctx.restore();
            },
            update: function() {
                this.velocity += physics.gravity;
                this.y += this.velocity;
                if (this.y + this.h >= canvas.height - 112) {
                    this.y = canvas.height - 112 - this.h;
                    if (gameState !== "GAMEOVER") triggerGameOver();
                }
            },
            flap: function() {
                this.velocity = physics.jump;
                audio.wing.currentTime = 0;
                audio.wing.play().catch(()=>{}); 
            }
        };

        const pipes = {
            items: [], w: 52, h: 320, gap: 100, dx: physics.speed,
            draw: function() {
                for (let i = 0; i < this.items.length; i++) {
                    let p = this.items[i];
                    let rx = Math.round(p.x);
                    let ry = Math.round(p.y);

                    // Vẽ ống trên (Lật ngược ống dưới)
                    ctx.save();
                    ctx.translate(rx, ry); 
                    ctx.scale(1, -1); 
                    ctx.drawImage(sprites.pipeBottom, 0, 0, this.w, this.h); 
                    ctx.restore();
                    
                    // Vẽ ống dưới
                    ctx.drawImage(sprites.pipeBottom, rx, ry + this.gap, this.w, this.h);
                }
            },
            update: function() {
                if (frames % 100 === 0) {
                    let maxY = canvas.height - 112 - this.gap - 50;
                    let minY = 50;
                    let yPos = Math.floor(Math.random() * (maxY - minY + 1)) + minY;
                    this.items.push({ x: canvas.width, y: yPos, passed: false });
                }
                for (let i = 0; i < this.items.length; i++) {
                    let p = this.items[i];
                    p.x -= this.dx;
                    if (p.x + this.w <= 0) { this.items.shift(); i--; continue; }
                    
                    if (p.x + this.w < bird.x && !p.passed) {
                        score++; p.passed = true;
                        audio.point.currentTime = 0; audio.point.play().catch(()=>{});
                    }
                    
                    // Xử lý va chạm
                    const bL = bird.x + 4, bR = bird.x + bird.w - 4, bT = bird.y + 4, bB = bird.y + bird.h - 4;
                    if (bR > p.x && bL < p.x + this.w) {
                        if (bT < p.y || bB > p.y + this.gap) { 
                            triggerGameOver();
                        }
                    }
                }
            },
            reset: function() { this.items = []; }
        };

        const ground = {
            x: 0, y: canvas.height - 112, w: 336, h: 112, dx: physics.speed,
            draw: function() {
                ctx.drawImage(sprites.ground, Math.round(this.x), Math.round(this.y));
                ctx.drawImage(sprites.ground, Math.round(this.x + this.w), Math.round(this.y));
            },
            update: function() { this.x = (this.x - this.dx) % (this.w / 2); }
        };

        // --- HÀM VẼ UI ---
        function drawLargeScore(currentScore, x, y) {
            let str = currentScore.toString();
            let width = 24; 
            let startX = x - (str.length * width) / 2;
            for (let i = 0; i < str.length; i++) {
                let digit = parseInt(str[i]);
                if (numSprites[digit].complete) ctx.drawImage(numSprites[digit], Math.round(startX + i * width), Math.round(y));
            }
        }

        function drawSmallScore(num, rightX, y) {
            let str = num.toString();
            let w = 14; let h = 20;
            let startX = rightX - (str.length * (w + 1)); 
            for (let i = 0; i < str.length; i++) {
                let digit = parseInt(str[i]);
                if (numSprites[digit].complete) ctx.drawImage(numSprites[digit], Math.round(startX + i * (w + 1)), Math.round(y), w, h);
            }
        }

        function drawPauseButton() {
            let px = 10, py = 10, pw = 26, ph = 28;
            ctx.fillStyle = "#543847"; ctx.fillRect(px, py, pw, ph); 
            ctx.fillStyle = "#ffffff"; ctx.fillRect(px+1, py+1, pw-2, ph-2); 
            ctx.fillStyle = "#e86101"; ctx.fillRect(px+2, py+2, pw-4, ph-4); 
            
            ctx.fillStyle = "#ffffff";
            if (gameState === "PAUSED") {
                ctx.beginPath(); ctx.moveTo(px+8, py+6); ctx.lineTo(px+20, py+14); ctx.lineTo(px+8, py+22); ctx.fill();
            } else {
                ctx.fillRect(px + 7, py + 7, 4, 14);
                ctx.fillRect(px + 15, py + 7, 4, 14);
            }
        }

        // Vẽ chữ GAME OVER dạng 3D khối viền kép, đổ bóng đậm chất retro
        function drawRetroGameOver(x, y) {
            ctx.save();
            ctx.font = "bold 32px 'Arial Black', 'Impact', sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            let txt = "game over";
            
            // Vẽ lớp bóng đổ dầy màu nâu sẫm phía dưới
            ctx.fillStyle = "#543847";
            for(let i=0; i<=4; i++) {
                ctx.fillText(txt, x - 2, y + i);
                ctx.fillText(txt, x + 2, y + i);
                ctx.fillText(txt, x, y + i);
            }
            
            // Vẽ viền nâu mỏng bao quanh mặt chữ chính
            ctx.strokeStyle = "#543847";
            ctx.lineWidth = 5;
            ctx.strokeText(txt, x, y);

            // Vẽ khối màu cam đậm ở giữa
            ctx.fillStyle = "#d85000";
            ctx.fillText(txt, x, y + 1);

            // Vẽ mặt chữ vàng sáng lên trên cùng tạo hiệu ứng 3D khối
            ctx.fillStyle = "#f8b800";
            ctx.fillText(txt, x, y);
            ctx.restore();
        }

        // Vẽ bảng điểm (Beige Board) phong cách Pixel-Art hoàn hảo
        function drawPixelBoard(x, y, w, h) {
            // 1. Viền nâu ngoài cùng giật cấp nhẹ ở góc
            ctx.fillStyle = "#543847";
            ctx.fillRect(x + 4, y, w - 8, h);
            ctx.fillRect(x, y + 4, w, h - 8);
            ctx.fillRect(x + 2, y + 2, w - 4, h - 4);

            // 2. Viền trắng nổi khối 3D phía trong
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(x + 4, y + 2, w - 8, h - 4);
            ctx.fillRect(x + 2, y + 4, w - 4, h - 8);

            // 3. Nền vàng cát (Beige) của bảng điểm chính
            ctx.fillStyle = "#ded895";
            ctx.fillRect(x + 6, y + 4, w - 12, h - 8);
            ctx.fillRect(x + 4, y + 6, w - 8, h - 12);

            // 4. Đổ bóng khối sẫm màu bên trong góc dưới và bên phải
            ctx.fillStyle = "#c5be84";
            ctx.fillRect(x + 6, y + h - 8, w - 12, 4);
            ctx.fillRect(x + w - 8, y + 6, 4, h - 12);
        }

        // Vẽ Nút Bấm Pixel-Art (OK & SHARE) đổ bóng cơ học
        function drawPixelButton(x, y, w, h, text) {
            // Viền nâu ngoài
            ctx.fillStyle = "#543847";
            ctx.fillRect(x + 2, y, w - 4, h);
            ctx.fillRect(x, y + 2, w, h - 2);
            ctx.fillRect(x + 1, y + 1, w - 2, h - 2);

            // Viền trắng nổi bên trong
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(x + 2, y + 1, w - 4, h - 2);
            ctx.fillRect(x + 1, y + 2, w - 2, h - 4);

            // Thân nút màu cam
            ctx.fillStyle = "#e86101";
            ctx.fillRect(x + 2, y + 2, w - 4, h - 4);

            // Chữ text hiển thị
            ctx.fillStyle = "white";
            ctx.font = "bold 13px 'Courier New', monospace";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(text, x + w / 2, y + h / 2 + 1);
        }

        // Vẽ Huy Chương Pixel-Art đổ bóng lấp lánh và có biểu tượng chim Flappy
        function drawPixelMedal(cx, cy) {
            let tier = score >= 40 ? "platinum" : (score >= 30 ? "gold" : (score >= 20 ? "silver" : "bronze"));
            let colors = {
                "bronze": ["#cf743c", "#f1a165", "#9b4b10"], // Thân chính, Bóng sáng, Bóng tối
                "silver": ["#b4b2b4", "#ffffff", "#7c7c7c"],
                "gold": ["#f1b007", "#ffff70", "#b37b00"],
                "platinum": ["#86cbd6", "#ffffff", "#4b9aa7"]
            };

            let c = colors[tier];

            // Vẽ viền nâu ngoài cùng dạng răng cưa Pixel
            ctx.fillStyle = "#543847";
            ctx.fillRect(cx - 16, cy - 20, 32, 40);
            ctx.fillRect(cx - 20, cy - 16, 40, 32);

            // Vẽ viền trắng lót
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(cx - 14, cy - 18, 28, 36);
            ctx.fillRect(cx - 18, cy - 14, 36, 28);

            // Thân huy chương kim loại chính
            ctx.fillStyle = c[0];
            ctx.fillRect(cx - 12, cy - 16, 24, 32);
            ctx.fillRect(cx - 16, cy - 12, 32, 24);

            // Ánh lấp lánh (Highlight) màu sáng ở góc trên bên trái
            ctx.fillStyle = c[1];
            ctx.fillRect(cx - 12, cy - 8, 4, 16);
            ctx.fillRect(cx - 8, cy - 12, 16, 4);
            ctx.fillRect(cx - 10, cy - 10, 6, 6);

            // Bóng tối (Shadow) ở góc dưới bên phải
            ctx.fillStyle = c[2];
            ctx.fillRect(cx + 8, cy - 8, 4, 16);
            ctx.fillRect(cx - 8, cy + 8, 16, 4);

            // --- VẼ CHÚ CHIM FLAPPY SIÊU NHỎ BÊN TRONG HUY CHƯƠNG ---
            ctx.fillStyle = "#543847"; // Viền chim
            ctx.fillRect(cx - 7, cy - 3, 12, 7);
            ctx.fillRect(cx - 4, cy - 5, 8, 3);
            
            ctx.fillStyle = "#ffffff"; // Mắt trắng
            ctx.fillRect(cx + 1, cy - 4, 2, 3);
            ctx.fillStyle = "#000000"; // Con ngươi
            ctx.fillRect(cx + 2, cy - 3, 1, 1);

            ctx.fillStyle = "#f77f00"; // Mỏ cam
            ctx.fillRect(cx + 3, cy, 3, 3);
        }

        function drawGameOverBoard() {
            let boardW = 226, boardH = 114;
            let boardX = Math.round((canvas.width - boardW) / 2);
            
            // Vẽ chữ Game Over Retro
            drawRetroGameOver(canvas.width / 2, uiY - 35);

            // Vẽ bảng điểm Pixel Bevel
            drawPixelBoard(boardX, uiY, boardW, boardH);

            // Chữ "MEDAL" và "SCORE" màu vàng cam viền nâu
            ctx.font = "bold 11px 'Courier New', monospace";
            ctx.textAlign = "left";
            ctx.lineWidth = 2.5; ctx.strokeStyle = "#543847"; ctx.fillStyle = "#e89443";
            
            ctx.strokeText("MEDAL", boardX + 20, uiY + 24); ctx.fillText("MEDAL", boardX + 20, uiY + 24);
            ctx.textAlign = "right";
            ctx.strokeText("SCORE", boardX + boardW - 20, uiY + 24); ctx.fillText("SCORE", boardX + boardW - 20, uiY + 24);
            ctx.strokeText("BEST", boardX + boardW - 20, uiY + 68); ctx.fillText("BEST", boardX + boardW - 20, uiY + 68);

            // Vẽ Huy Chương nếu đạt mốc điểm
            if (score >= 10) {
                drawPixelMedal(boardX + 44, uiY + 62);
            } else {
                // Khung tròn pixel trống khi không có huy chương
                ctx.fillStyle = "#543847";
                ctx.fillRect(boardX + 26, uiY + 44, 36, 36);
                ctx.fillRect(boardX + 24, uiY + 46, 40, 32);
                ctx.fillStyle = "#b5ae73";
                ctx.fillRect(boardX + 28, uiY + 46, 32, 32);
                ctx.fillRect(boardX + 26, uiY + 48, 36, 28);
            }

            // Thẻ đỏ NEW BEST
            if (isNewBest) {
                ctx.fillStyle = "#ff0000"; ctx.fillRect(boardX + boardW - 105, uiY + 54, 30, 13);
                ctx.fillStyle = "white"; ctx.font = "bold 9px 'Arial'"; ctx.textAlign = "center";
                ctx.fillText("NEW", boardX + boardW - 90, uiY + 64);
            }

            // Điểm số
            drawSmallScore(score, boardX + boardW - 20, uiY + 30);
            drawSmallScore(bestScore, boardX + boardW - 20, uiY + 74);

            // --- VẼ HAI NÚT BẤM PIXEL "OK" và "SHARE" ---
            let btnW = 96, btnH = 32, btnY = uiY + boardH + 15;
            
            // Nút OK
            drawPixelButton(boardX, btnY, btnW, btnH, "OK");
            
            // Nút SHARE
            let rightBtnX = boardX + boardW - btnW;
            drawPixelButton(rightBtnX, btnY, btnW, btnH, "SHARE");
        }

        // --- VÒNG LẶP & LOGIC CHÍNH ---
        function draw() {
            ctx.fillStyle = "#70c5ce"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Toạ độ cuộn cảnh làm tròn để không bị nhòe pixel
            let bx = Math.round(bgX);

            // Vẽ nền Ngày
            if (sprites.bgDay.complete) {
                ctx.drawImage(sprites.bgDay, bx, 0);
                ctx.drawImage(sprites.bgDay, bx + 288, 0);
            }
            
            // Vẽ đè nền Đêm từ từ (Lerp Alpha) lên trên nền Ngày
            if (sprites.bgNight.complete && dayNightAlpha > 0) {
                ctx.save();
                ctx.globalAlpha = dayNightAlpha;
                ctx.drawImage(sprites.bgNight, bx, 0);
                ctx.drawImage(sprites.bgNight, bx + 288, 0);
                ctx.restore();
            }

            // Vẽ các ngôi sao nhấp nháy lấp lánh khi trời tối hẳn
            if (dayNightAlpha > 0.4) {
                ctx.save();
                ctx.globalAlpha = (dayNightAlpha - 0.4) / 0.6; // Mờ dần khi trời chuyển giao
                ctx.fillStyle = "#ffffff";
                let stars = [
                    {x: 35, y: 45}, {x: 95, y: 30}, {x: 155, y: 55}, 
                    {x: 205, y: 35}, {x: 255, y: 65}, {x: 115, y: 20}
                ];
                for (let i = 0; i < stars.length; i++) {
                    let s = stars[i];
                    // Tạo hiệu ứng lấp lánh tuần hoàn bằng hàm sin
                    let blink = (Math.sin(frames * 0.05 + i) + 1) / 2;
                    if (blink > 0.3) {
                        ctx.fillRect(s.x, s.y, 2, 2); // Vẽ hạt sao pixel 2x2
                    }
                }
                ctx.restore();
            }
            
            pipes.draw(); ground.draw(); bird.draw(); flash.draw();

            if (gameState === "PREGAME") {
                if(sprites.getReady.complete) ctx.drawImage(sprites.getReady, canvas.width/2 - 184/2, canvas.height/2 - 267/2 - 30);
            }
            if (gameState === "PLAYING" || gameState === "PAUSED" || (gameState === "GAMEOVER" && flash.alpha > 0)) {
                drawLargeScore(score, canvas.width/2, 50);
                drawPauseButton(); 
            }
            if (gameState === "GAMEOVER" && flash.alpha <= 0) {
                drawGameOverBoard();
            }
        }

        function update() {
            // Chu kỳ Ngày Đêm tuần hoàn chậm rãi, mượt mà (60 giây đổi một lần)
            dayNightAlpha = (Math.sin(frames * 0.0005) + 1) / 2; 

            if (gameState === "PLAYING" || gameState === "PREGAME") {
                // Cuộn phông nền phía sau siêu chậm (tốc độ bằng 1/10 nền đất) tạo hiệu ứng chiều sâu Parallax
                bgX = (bgX - 0.2) % 288;
            }

            if (gameState === "PLAYING") {
                bird.update(); pipes.update(); ground.update();
            } else if (gameState === "PREGAME") {
                bird.y = 200 + Math.cos(frames / 10) * 5; ground.update();
            } else if (gameState === "GAMEOVER") {
                gameOverTimer++;
                if (bird.y + bird.h < canvas.height - 112) bird.update();
                
                if (flash.alpha <= 0 && uiY > 160) {
                    uiY -= (uiY - 160) * 0.15; 
                }
            }
        }

        function loop() { 
            // Ép tắt khử răng cưa của toàn bộ các trình duyệt để dựng hình sắc nét
            ctx.imageSmoothingEnabled = false;
            ctx.mozImageSmoothingEnabled = false;
            ctx.webkitImageSmoothingEnabled = false;
            ctx.msImageSmoothingEnabled = false;

            update(); 
            draw(); 
            if(gameState !== "PAUSED") frames++; 
            requestAnimationFrame(loop); 
        }

        function triggerGameOver() {
            if (gameState !== "GAMEOVER") {
                gameState = "GAMEOVER"; gameOverTimer = 0; uiY = canvas.height; 
                audio.hit.play().catch(()=>{}); flash.trigger();
                
                isNewBest = score > bestScore;
                if (isNewBest) {
                    bestScore = score;
                    localStorage.setItem("flappySpriteBest", bestScore);
                }
            }
        }

        function inputHandler(e) {
            if(e.type === 'touchstart') {
                if (e.target === canvas) e.preventDefault();
            }
            
            if (e.type === 'keydown' && e.code === 'KeyP') {
                if (gameState === "PLAYING") gameState = "PAUSED";
                else if (gameState === "PAUSED") gameState = "PLAYING";
                return;
            }

            if (e.type === 'keydown' && e.code !== 'Space') return;
            
            if (e.type === 'mousedown' || e.type === 'touchstart') {
                let rect = canvas.getBoundingClientRect();
                let scaleX = canvas.width / rect.width;
                let scaleY = canvas.height / rect.height;
                let clientX = e.clientX || (e.touches && e.touches[0].clientX);
                let clientY = e.clientY || (e.touches && e.touches[0].clientY);
                
                let clickX = (clientX - rect.left) * scaleX;
                let clickY = (clientY - rect.top) * scaleY;

                // 1. Nhấn nút Pause (10, 10, rộng 26, cao 28)
                if ((gameState === "PLAYING" || gameState === "PAUSED") && clickX >= 10 && clickX <= 36 && clickY >= 10 && clickY <= 38) {
                    if (gameState === "PLAYING") gameState = "PAUSED";
                    else if (gameState === "PAUSED") gameState = "PLAYING";
                    return; 
                }

                // 2. Nhấn nút OK để chơi lại khi chết
                if (gameState === "GAMEOVER" && gameOverTimer > 40) {
                    let boardW = 226, boardH = 114;
                    let boardX = (canvas.width - boardW) / 2;
                    let btnW = 96, btnH = 32, btnY = uiY + boardH + 15;
                    
                    // Click vào nút OK (bên trái)
                    if (clickX >= boardX && clickX <= boardX + btnW && clickY >= btnY && clickY <= btnY + btnH) {
                        bird.y = 200; bird.velocity = 0; pipes.reset(); score = 0; frames = 0;
                        gameState = "PREGAME";
                        return;
                    }
                }
            }

            if (gameState === "PAUSED") return; 

            if (gameState === "PREGAME") {
                gameState = "PLAYING"; bird.flap();
            } else if (gameState === "PLAYING") {
                bird.flap();
            } else if (gameState === "GAMEOVER" && gameOverTimer > 40) { 
                // Click bên ngoài nút vẫn reset (Mobile)
                bird.y = 200; bird.velocity = 0; pipes.reset(); score = 0; frames = 0;
                gameState = "PREGAME";
            }
        }

        window.addEventListener("keydown", inputHandler);
        canvas.addEventListener("mousedown", inputHandler);
        canvas.addEventListener("touchstart", inputHandler, { passive: false });

        sprites.bgDay.onload = loop; 
    </script>
</body>
</html>
