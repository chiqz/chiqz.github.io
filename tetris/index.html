<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TETRIS</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; color: #fff; }
  #title { font-size: 32px; font-weight: 700; letter-spacing: 8px; color: #fff; margin-bottom: 1.2rem; text-transform: uppercase; }
  #game-area { display: flex; gap: 20px; align-items: flex-start; }
  #board-wrap { position: relative; }
  canvas#board { display: block; border: 2px solid #444; background: #0a0a0a; }
  #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.85); color: #fff; }
  #overlay h3 { font-size: 24px; letter-spacing: 4px; margin-bottom: 12px; text-transform: uppercase; }
  #overlay p { font-size: 13px; color: #aaa; margin-bottom: 20px; text-align: center; line-height: 1.8; }
  #start-btn { background: #fff; color: #000; border: none; padding: 10px 28px; font-size: 14px; font-weight: 700; letter-spacing: 2px; cursor: pointer; text-transform: uppercase; }
  #start-btn:hover { background: #ddd; }
  #sidebar { width: 130px; display: flex; flex-direction: column; gap: 14px; }
  .side-box { border: 1px solid #333; padding: 10px 12px; }
  .side-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #888; margin-bottom: 6px; }
  .side-val { font-size: 22px; font-weight: 700; color: #fff; }
  canvas#next { display: block; background: #0a0a0a; border: 1px solid #333; }
  #controls { font-size: 11px; color: #555; line-height: 2.1; }
  #controls span { display: block; }
  #mobile-btns { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; justify-content: center; }
  .mbtn { background: #222; border: 1px solid #444; color: #fff; font-size: 18px; width: 52px; height: 52px; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 4px; user-select: none; }
  .mbtn:active { background: #333; }
  #drop-btn { width: auto; padding: 0 16px; font-size: 13px; font-weight: 700; letter-spacing: 1px; }
  #high-box { border: 1px solid #333; padding: 10px 12px; }
</style>
</head>
<body>

<div id="title">TETRIS</div>
<div id="game-area">
  <div id="board-wrap">
    <canvas id="board" width="200" height="400"></canvas>
    <div id="overlay">
      <h3>TETRIS</h3>
      <p>← → &nbsp;Move<br>↑ &nbsp;Hard drop<br>↓ &nbsp;Soft drop<br>Space &nbsp;Rotate<br>P &nbsp;Pause</p>
      <button id="start-btn">START</button>
    </div>
  </div>
  <div id="sidebar">
    <div class="side-box">
      <div class="side-label">Score</div>
      <div class="side-val" id="score">0</div>
    </div>
    <div class="side-box">
      <div class="side-label">Best</div>
      <div class="side-val" id="best">0</div>
    </div>
    <div class="side-box">
      <div class="side-label">Lines</div>
      <div class="side-val" id="lines">0</div>
    </div>
    <div class="side-box">
      <div class="side-label">Level</div>
      <div class="side-val" id="level">1</div>
    </div>
    <div class="side-box">
      <div class="side-label">Next</div>
      <canvas id="next" width="80" height="80"></canvas>
    </div>
    <div id="controls">
      <span>← → Move</span>
      <span>↑ Hard drop</span>
      <span>↓ Soft drop</span>
      <span>Space Rotate</span>
      <span>P Pause</span>
    </div>
  </div>
</div>
<div id="mobile-btns">
  <button class="mbtn" id="btn-left">←</button>
  <button class="mbtn" id="btn-rot">↻</button>
  <button class="mbtn" id="btn-right">→</button>
  <button class="mbtn" id="btn-down">↓</button>
  <button class="mbtn" id="drop-btn">DROP</button>
</div>

<script>
const COLS = 10, ROWS = 20, SZ = 20;
const board = document.getElementById('board');
const ctx = board.getContext('2d');
const nextCvs = document.getElementById('next');
const nctx = nextCvs.getContext('2d');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('start-btn');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const linesEl = document.getElementById('lines');
const levelEl = document.getElementById('level');

const PIECES = [
  { shape: [[1,1,1,1]], color: '#00cfcf' },
  { shape: [[1,1],[1,1]], color: '#f0d000' },
  { shape: [[0,1,0],[1,1,1]], color: '#a000f0' },
  { shape: [[1,0],[1,0],[1,1]], color: '#f0a000' },
  { shape: [[0,1],[0,1],[1,1]], color: '#0060f0' },
  { shape: [[0,1,1],[1,1,0]], color: '#00d000' },
  { shape: [[1,1,0],[0,1,1]], color: '#f03000' },
];

let grid, piece, next, score, lines, level, running, paused, raf, lastTime, dropAcc;
let highScore = 0;

function newGrid() { return Array.from({length:ROWS}, () => Array(COLS).fill(0)); }

function randPiece() {
  const p = PIECES[Math.floor(Math.random() * PIECES.length)];
  return { shape: p.shape.map(r => [...r]), color: p.color, x: Math.floor((COLS - p.shape[0].length) / 2), y: 0 };
}

function rotate(shape) {
  const r = shape[0].length, c = shape.length;
  return Array.from({length: r}, (_, i) => Array.from({length: c}, (_, j) => shape[c-1-j][i]));
}

function fits(sh, x, y) {
  for (let r = 0; r < sh.length; r++) for (let c = 0; c < sh[r].length; c++) {
    if (!sh[r][c]) continue;
    const nx = x + c, ny = y + r;
    if (nx < 0 || nx >= COLS || ny >= ROWS) return false;
    if (ny >= 0 && grid[ny][nx]) return false;
  }
  return true;
}

function lock() {
  piece.shape.forEach((row, r) => row.forEach((v, c) => { if (v) grid[piece.y+r][piece.x+c] = piece.color; }));
  let cleared = 0;
  for (let r = ROWS - 1; r >= 0; r--) {
    if (grid[r].every(v => v)) { grid.splice(r, 1); grid.unshift(Array(COLS).fill(0)); cleared++; r++; }
  }
  if (cleared) {
    const pts = [0, 100, 300, 500, 800][cleared] * level;
    score += pts; lines += cleared; level = Math.floor(lines / 10) + 1;
    scoreEl.textContent = score; linesEl.textContent = lines; levelEl.textContent = level;
  }
  piece = next; next = randPiece();
  if (!fits(piece.shape, piece.x, piece.y)) gameOver();
}

function drawBlock(c2d, x, y, color) {
  c2d.fillStyle = color;
  c2d.fillRect(x*SZ+1, y*SZ+1, SZ-2, SZ-2);
  c2d.fillStyle = 'rgba(255,255,255,0.15)';
  c2d.fillRect(x*SZ+1, y*SZ+1, SZ-2, 4);
  c2d.fillStyle = 'rgba(0,0,0,0.25)';
  c2d.fillRect(x*SZ+1, y*SZ+SZ-5, SZ-2, 4);
}

function ghostY() {
  let gy = piece.y;
  while (fits(piece.shape, piece.x, gy + 1)) gy++;
  return gy;
}

function draw() {
  ctx.clearRect(0, 0, board.width, board.height);
  ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0, 0, board.width, board.height);
  ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 0.5;
  for (let r = 0; r < ROWS; r++) { ctx.beginPath(); ctx.moveTo(0, r*SZ); ctx.lineTo(COLS*SZ, r*SZ); ctx.stroke(); }
  for (let c = 0; c < COLS; c++) { ctx.beginPath(); ctx.moveTo(c*SZ, 0); ctx.lineTo(c*SZ, ROWS*SZ); ctx.stroke(); }
  grid.forEach((row, r) => row.forEach((v, c) => { if (v) drawBlock(ctx, c, r, v); }));
  const gy = ghostY();
  if (gy !== piece.y) {
    ctx.globalAlpha = 0.22;
    piece.shape.forEach((row, r) => row.forEach((v, c) => { if (v) drawBlock(ctx, piece.x+c, gy+r, piece.color); }));
    ctx.globalAlpha = 1;
  }
  piece.shape.forEach((row, r) => row.forEach((v, c) => { if (v) drawBlock(ctx, piece.x+c, piece.y+r, piece.color); }));
  nctx.fillStyle = '#0a0a0a'; nctx.fillRect(0, 0, 80, 80);
  const nx = Math.floor((4 - next.shape[0].length) / 2);
  const ny = Math.floor((4 - next.shape.length) / 2);
  next.shape.forEach((row, r) => row.forEach((v, c) => { if (v) drawBlock(nctx, nx+c, ny+r, next.color); }));
}

function loop(ts) {
  if (!running || paused) return;
  const dt = ts - lastTime; lastTime = ts;
  dropAcc += dt;
  const speed = Math.max(80, 600 - level * 50);
  if (dropAcc >= speed) { dropAcc = 0; if (fits(piece.shape, piece.x, piece.y + 1)) piece.y++; else lock(); }
  draw(); raf = requestAnimationFrame(loop);
}

function startGame() {
  grid = newGrid(); score = 0; lines = 0; level = 1;
  scoreEl.textContent = 0; linesEl.textContent = 0; levelEl.textContent = 1;
  piece = randPiece(); next = randPiece();
  running = true; paused = false; dropAcc = 0; lastTime = 0;
  overlay.style.display = 'none';
  raf = requestAnimationFrame(t => { lastTime = t; loop(t); });
}

function gameOver() {
  running = false; cancelAnimationFrame(raf);
  if (score > highScore) { highScore = score; bestEl.textContent = highScore; }
  overlay.querySelector('h3').textContent = 'GAME OVER';
  overlay.querySelector('p').innerHTML = 'Score: <strong style="color:#fff">' + score + '</strong><br>Best: <strong style="color:#fff">' + highScore + '</strong><br><br>Press start to play again';
  startBtn.textContent = 'PLAY AGAIN';
  overlay.style.display = 'flex';
}

startBtn.addEventListener('click', startGame);

document.addEventListener('keydown', e => {
  if (!running) return;
  if (e.key === 'p' || e.key === 'P') { paused = !paused; if (!paused) { lastTime = performance.now(); raf = requestAnimationFrame(loop); } return; }
  if (paused) return;
  if (e.key === 'ArrowLeft') { if (fits(piece.shape, piece.x-1, piece.y)) piece.x--; draw(); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { if (fits(piece.shape, piece.x+1, piece.y)) piece.x++; draw(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { while (fits(piece.shape, piece.x, piece.y+1)) { piece.y++; score += 2; } scoreEl.textContent = score; lock(); draw(); e.preventDefault(); }
  else if (e.key === 'ArrowDown') { if (fits(piece.shape, piece.x, piece.y+1)) { piece.y++; score += 1; scoreEl.textContent = score; } draw(); e.preventDefault(); }
  else if (e.key === ' ') { const r = rotate(piece.shape); if (fits(r, piece.x, piece.y)) piece.shape = r; draw(); e.preventDefault(); }
});

document.getElementById('btn-left').addEventListener('click', () => { if (running && !paused && fits(piece.shape, piece.x-1, piece.y)) { piece.x--; draw(); } });
document.getElementById('btn-right').addEventListener('click', () => { if (running && !paused && fits(piece.shape, piece.x+1, piece.y)) { piece.x++; draw(); } });
document.getElementById('btn-rot').addEventListener('click', () => { if (running && !paused) { const r = rotate(piece.shape); if (fits(r, piece.x, piece.y)) piece.shape = r; draw(); } });
document.getElementById('btn-down').addEventListener('click', () => { if (running && !paused && fits(piece.shape, piece.x, piece.y+1)) { piece.y++; draw(); } });
document.getElementById('drop-btn').addEventListener('click', () => { if (running && !paused) { while (fits(piece.shape, piece.x, piece.y+1)) piece.y++; lock(); draw(); } });
</script>
</body>
</html>
